name: DevSecOps Pipeline with DefectDojo Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # 1. Поиск секретов (Gitleaks)
  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
        continue-on-error: true

 # Этап 2: SAST (Static Application Security Testing)
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Сканирование с покрытием всех уровней архитектуры проекта
      - name: Run Semgrep with Comprehensive Rulesets
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --config "p/python" \
            --config "p/django" \
            --config "p/javascript" \
            --exclude="tests/" \
            --exclude="unittests/" \
            --json \
            --output semgrep-report.json || true

      # Отправка структурированного отчета в DefectDojo
      - name: Upload SAST Report to DefectDojo
        if: always()
        run: |
          if [ -f semgrep-report.json ]; then
            curl -s -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "scan_type=Semgrep JSON Report" \
              -F "active=true" \
              -F "verified=true" \
              -F "close_old_findings=false" \
              -F "file=@semgrep-report.json"
          fi

      # Сохранение артефакта в сборке GitHub Actions
      - name: Save SAST Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep-report.json

  # 3. Анализ уязвимостей в зависимостях (Trivy SCA) + отправка в DefectDojo
  sca-scan:
    name: SCA Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      - name: Upload Trivy to DefectDojo
        if: always()
        run: |
          if [ -f trivy-report.json ]; then
            curl -v -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "scan_type=Trivy Scan" \
              -F "active=true" \
              -F "verified=true" \
              -F "close_old_findings=true" \
              -F "file=@trivy-report.json"
          fi
# 4. Автоматическая доставка и обновление на VPS (CD)
  deploy:
    name: Deploy to VPS
    needs: [sast-scan, sca-scan, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /opt/defectdojo
            docker compose up -d uwsgi celeryworker celerybeat nginx postgres valkey
# 5. Этап 3: DAST (Dynamic Application Security Testing) через OWASP ZAP
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://201.24.56.40:8080'
          ruleset: ''
          cmd_options: '-m 2 -a -r zap_report.html -x zap_report.xml'
        continue-on-error: true

      - name: Upload DAST to DefectDojo
        if: always()
        run: |
          # Ищем сформированный XML-отчет ZAP
          REPORT_FILE=$(find /home/runner/work/ -name "zap_report.xml" -o -name "*zap*.xml" -o -name "report_xml.xml" 2>/dev/null | head -n 1)
          
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            echo "Found ZAP XML report: $REPORT_FILE"
            ls -lh "$REPORT_FILE"
            curl -i -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "scan_type=ZAP Scan" \
              -F "active=true" \
              -F "verified=true" \
              -F "close_old_findings=false" \
              -F "file=@$REPORT_FILE"
          else
            echo "XML report not found, listing workspace:"
            find . -name "*.xml" -o -name "*.json"
          fi

      - name: Upload ZAP Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            *.html
            *.xml
            *.json
          if-no-files-found: ignore
